# GitHub Actions Workflow: Build with SLSA Level 3 Attestation
# This workflow demonstrates code-to-cloud traceability with artifact attestations
#
# Reference: https://github.blog/changelog/2026-01-20-strengthen-your-supply-chain-with-code-to-cloud-traceability-and-slsa-build-level-3-security/

name: Build and Attest Artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_deployment_record:
        description: 'Create deployment record after build'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write        # Required for OIDC token (attestations)
  attestations: write    # Required for creating attestations

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # We'll use attest-build-provenance instead

      # ============================================================
      # SLSA Build Level 3: Artifact Attestation
      # This creates a cryptographic signature binding the artifact
      # to this repository and build workflow
      # ============================================================
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # This automatically creates a storage record when pushing to GHCR

      # ============================================================
      # Generate and Attest SBOM (Software Bill of Materials)
      # ============================================================
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        id: sbom
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # ============================================================
      # Summary: Display attestation info
      # ============================================================
      - name: Summary
        run: |
          echo "## Build Attestation Complete 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Attestation Bundle | \`${{ steps.attest.outputs.bundle-path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA Level | **Build Level 3** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Attestations Created" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build Provenance (SLSA)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM (SPDX)" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Optional: Create deployment record when deploying
  # ============================================================
  create-deployment-record:
    needs: build-and-attest
    if: github.event.inputs.create_deployment_record == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Deployment Record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract org and repo
          ORG=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          # Create deployment record via GitHub API
          # This links the artifact to its deployment location
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${ORG}/packages/container/${REPO}/versions/${{ needs.build-and-attest.outputs.digest }}/deployment-records" \
            -d '{
              "environment": "staging",
              "cloud_provider": "kubernetes",
              "cluster_name": "staging-cluster",
              "namespace": "openbao",
              "runtime_risk": {
                "internet_exposed": false,
                "processes_sensitive_data": true,
                "risk_level": "medium"
              },
              "deployment_timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }'
          
          echo "✅ Deployment record created for staging environment"

  # ============================================================
  # Binary Build with Attestation (alternative to container)
  # ============================================================
  build-binary:
    runs-on: ubuntu-latest
    if: false  # Set to true to enable binary builds
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -o openbao ./main.go
          sha256sum openbao > openbao.sha256

      - name: Attest Binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: openbao
          subject-name: openbao-binary

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbao-binary
          path: |
            openbao
            openbao.sha256
