# CI Pipeline - Caller Workflow
# This calls the reusable workflow to achieve SLSA L3
#
# IMPORTANT: This workflow CANNOT modify the build/attestation logic
# because that happens in the reusable workflow

name: CI Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_records:
        description: 'Create storage/deployment records'
        type: boolean
        default: false

# Caller permissions - passed to reusable workflow
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SLSA L3 Build - Uses reusable workflow for isolation
  # ═══════════════════════════════════════════════════════════════
  build:
    uses: ./.github/workflows/slsa-l3-reusable.yml
    with:
      image_name: ${{ github.repository }}
      registry: ghcr.io

  # ═══════════════════════════════════════════════════════════════
  # NEW: Create Storage Record (Code-to-Cloud Traceability)
  # This is NOT part of SLSA - it's operational metadata
  # ═══════════════════════════════════════════════════════════════
  create-storage-record:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Storage Record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          echo "Creating storage record..."
          echo "Org: $ORG"
          echo "Repo: $REPO"
          echo "Digest: ${{ needs.build.outputs.digest }}"
          
          # Note: This API endpoint is from the Jan 2026 announcement
          # It may require specific permissions or be in preview
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${ORG}/packages/container/${REPO}/versions/${{ needs.build.outputs.digest }}/storage-records" \
            -d '{
              "registry_url": "ghcr.io/'"${ORG}/${REPO}"':${{ github.sha }}",
              "registry_name": "GitHub Container Registry",
              "created_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }' || echo "Storage record API may not be available yet"

  # ═══════════════════════════════════════════════════════════════
  # Verify Attestations (Consumer side)
  # ═══════════════════════════════════════════════════════════════
  verify:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Verify Attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Verify the artifact came from this workflow
          gh attestation verify \
            oci://ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }} \
            --owner ${{ github.repository_owner }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/slsa-l3-reusable.yml \
            && echo "✅ Attestation verified!" >> $GITHUB_STEP_SUMMARY \
            || echo "❌ Verification failed" >> $GITHUB_STEP_SUMMARY
